[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workbuddy-qmt-bridge"
version = "0.3.4"
description = "A fail-closed bridge between WorkBuddy MCP and QMT embedded Python"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "peppaboar95" },
]
keywords = ["workbuddy", "mcp", "qmt", "trading", "risk-control"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/peppaboar95/workbuddy-qmt-bridge"
Repository = "https://github.com/peppaboar95/workbuddy-qmt-bridge"
Issues = "https://github.com/peppaboar95/workbuddy-qmt-bridge/issues"
Security = "https://github.com/peppaboar95/workbuddy-qmt-bridge/security"

[project.scripts]
workbuddy-qmt = "workbuddy_qmt.manager:main"
workbuddy-qmt-console = "workbuddy_qmt.console:main"
workbuddy-qmt-init = "workbuddy_qmt.bootstrap:main"
workbuddy-qmt-mcp = "workbuddy_qmt.mcp_server:main"
workbuddy-qmt-worker = "workbuddy_qmt.worker:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
workbuddy_qmt = ["assets/*.py"]
